# What the live shop answers, read from outside: the catalogue the app and the
# web both draw, its shelves, and whether each product's first photo loads.
#
# Run by hand (Actions → Live check → Run workflow) when the app or the site
# shows something odd and the question is whether the server or the client is
# at fault. It only reads public procedures and changes nothing.
name: Live check

on:
  workflow_dispatch:
    inputs:
      base:
        description: The shop's address
        default: https://netlet-project.vercel.app

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.base }}
    steps:
      - name: Health
        run: |
          curl -sS -m 30 "$BASE/healthz"; echo
          curl -sS -m 30 "$BASE/readyz"; echo

      - name: The catalogue, as the app asks for it
        run: |
          for locale in en ar; do
            input=$(printf '{"json":{"first":24,"locale":"%s"}}' "$locale" | jq -sRr @uri)
            curl -sS -m 60 -o "catalogue-$locale.json" -w "commerce.products.list ($locale): HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" \
              "$BASE/api/trpc/commerce.products.list?input=$input"
          done
          jq -r '.error // empty' catalogue-en.json
          echo "Products: $(jq '.result.data.json | length' catalogue-en.json)"
          jq -r '.result.data.json[] | [.id, .handle, (.productType // "-"), (.variants | length | tostring) + " variants",
            (if any(.variants[]; .compareAtPrice != null) then "on offer" else "-" end), (.images | length | tostring) + " photos",
            (.images[0].url // "no photo")] | @tsv' catalogue-en.json

      - name: The other shelves
        run: |
          for procedure in commerce.bestsellers commerce.departmentCounts commerce.stores commerce.brands; do
            input=$(printf '{"json":{"locale":"en"}}' | jq -sRr @uri)
            body=$(curl -sS -m 60 "$BASE/api/trpc/$procedure?input=$input")
            echo "$procedure: $(echo "$body" | jq -c '.error.json.message // (.result.data.json | if type == "array" then "\(length) rows" else . end)')"
          done

      - name: Does each product's first photo load
        run: |
          jq -r '.result.data.json[] | .images[0].url // empty' catalogue-en.json | while read -r photo; do
            case "$photo" in
              /*) address="$BASE$photo" ;;
              *) address="$photo" ;;
            esac
            curl -sS -m 30 -o /dev/null -L -w "%{http_code}  %{content_type}  %{size_download} bytes  $address\n" "$address" || echo "failed  $address"
          done

      # An iPhone app may refuse a host a browser accepts: App Transport
      # Security wants TLS 1.2 or later with a forward-secret cipher, and some
      # hosts treat an app's CFNetwork user agent differently from a browser's.
      - name: How each photo host answers an iPhone app
        run: |
          app_agent="NetLet/43 CFNetwork/3826.500.111.2.2 Darwin/25.0.0"
          jq -r '.result.data.json[] | .images[0].url // empty' catalogue-en.json | grep '^https://' | sort -u -t/ -k3,3 | while read -r photo; do
            host=$(echo "$photo" | cut -d/ -f3)
            echo "== $host"
            chain=$(openssl s_client -connect "$host:443" -servername "$host" -showcerts </dev/null 2>/dev/null)
            echo "certificates sent: $(echo "$chain" | grep -c 'BEGIN CERTIFICATE')"
            echo "$chain" | openssl x509 -noout -subject -issuer -enddate 2>/dev/null
            echo "$chain" | grep -E "^(Peer signature type|Server Temp Key|    Protocol|    Cipher)" | head -4
            for version in tls1_2 tls1_3; do
              if openssl s_client -connect "$host:443" -servername "$host" "-$version" </dev/null >/dev/null 2>&1; then echo "$version: yes"; else echo "$version: no"; fi
            done
            if openssl s_client -connect "$host:443" -servername "$host" -tls1_2 \
              -cipher 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305' </dev/null >/dev/null 2>&1
            then echo "forward-secret cipher on TLS 1.2: yes"; else echo "forward-secret cipher on TLS 1.2: no"; fi
            echo "as a browser: $(curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type}' -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1' "$photo")"
            echo "as the app:   $(curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type}' -A "$app_agent" -H 'Accept: image/*' "$photo")"
            echo "no agent:     $(curl -sS -m 30 -o /dev/null -w '%{http_code} %{content_type}' -A '' "$photo")"
            curl -sSI -m 30 -A "$app_agent" "$photo" | grep -iE '^(server|cf-|cache-control|content-length|x-frame|vary|strict-transport)' | head -8
          done
