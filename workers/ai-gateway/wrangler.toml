# NetLet's AI gateway — README.md beside this file is the setup.
#
# Secrets are never written here. Two are needed, set with wrangler:
#   GEMINI_API_KEY      the Gemini API key (Google AI Studio)
#   AI_GATEWAY_SECRET   32+ random characters, the same value as NetLet's
#                       own AI_GATEWAY_SECRET — it signs the tokens browsers
#                       present here
name = "netlet-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# The pages allowed to call from a browser: scheme and host exactly, comma-
# separated, no trailing slash. NetLet's own domain both ways, and Vercel's
# production address, which is where the site is served until the domain is
# connected and stays reachable after. A preview deployment's address is not
# here: each is different, and a preview has no business spending the key.
ALLOWED_ORIGINS = "https://netlet.net,https://www.netlet.net,https://netlet-project.vercel.app"
GEMINI_MODEL = "gemini-2.5-flash"

# Ceilings, counted by Cloudflare at the edge. A period is 10 or 60 seconds.
# Each namespace_id is any positive integer, unique within the account.

# A caller's questions to the shop's assistant.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

# A seller's product drafts.
[[ratelimits]]
name = "CATALOG_LIMITER"
namespace_id = "7102"
simple = { limit = 6, period = 60 }

# Everything from one network address, whoever's token: what stops a guest
# from minting tokens to reset their own ceiling. Generous, because an office
# or a mobile carrier puts many people behind one address.
[[ratelimits]]
name = "ADDRESS_LIMITER"
namespace_id = "7103"
simple = { limit = 40, period = 60 }

# NetLet's own server, per feature (search refinement, recommendations, photo
# search, support drafts, the review queue, the Arabic name). A backstop for a
# runaway loop rather than a per-shopper ceiling: each feature counts its
# shoppers in Postgres before it calls, and every call comes from Vercel's
# few addresses, so the address ceiling above never applies to these.
[[ratelimits]]
name = "SERVER_LIMITER"
namespace_id = "7104"
simple = { limit = 600, period = 60 }

[observability]
enabled = true
