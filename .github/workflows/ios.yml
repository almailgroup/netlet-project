name: iOS

# Builds the SwiftUI app and runs its unit tests on a simulator. It runs when
# the app or this file changes; a change to `Shared/` that the app copies is
# caught on Linux by `Frontend/iOS/scripts/exportShared.test.ts`, which fails
# until `pnpm ios:resources` has been run and its output committed here.
on:
  push:
    paths:
      - "Frontend/iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Frontend/iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      share:
        description: Also post small copies of the previews as check runs on the commit
        type: boolean
        default: false

# A newer push cancels an older one's run, since the newer commit is the one
# TestFlight should get. A run started by hand never cancels anything — it
# waits — because cancelling a push's run would also lose that push's upload.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Frontend/iOS
    steps:
      - uses: actions/checkout@v4

      # The Xcode the app ships with (testflight.yml uses the same), so the
      # tests and the previews see the SDK a phone will run it under.
      - name: Xcode
        run: bash scripts/select-xcode.sh 26

      # The newest iPhone simulator the runner's Xcode has, chosen by id so the
      # job does not break when the image's list of devices changes.
      - name: Pick a simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)
          for key in sorted(runtimes, key=version, reverse=True):
              phones = [d for d in runtimes[key] if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if version(key) >= (17, 0) and phones:
                  print(phones[0]["udid"])
                  break
          ')
          test -n "$id" || { echo "No iOS 17+ iPhone simulator available"; xcrun simctl list devices available; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # The whole log is kept; what is printed is the errors, the app's own
        # warnings and each test's verdict. The step fails with xcodebuild.
        run: |
          set +e
          mkdir -p build
          xcodebuild test \
            -project NetLet.xcodeproj \
            -scheme NetLet \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath build/NetLet.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log \
            | grep --line-buffered -E "error:|warning: .*/NetLet(Tests)?/|Test Case .* (passed|failed)|Executed|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          exit "$status"

      # A preview for anybody without a Mac: the app built above, installed on
      # the same simulator and opened on each screen in both languages,
      # answering from the demo recordings (-NetLetDemo YES). Full-size
      # pictures go up as the ios-previews artifact.
      - name: Take previews
        id: previews
        # Pictures are a courtesy; the tests above are the verdict.
        continue-on-error: true
        env:
          SIM: ${{ steps.simulator.outputs.id }}
        run: |
          set -e
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/NetLet.app
          test -d "$app"
          mkdir -p build/previews build/small
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b >/dev/null
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$SIM" "$app"
          shot() {  # name, language, screen, as
            xcrun simctl terminate "$SIM" com.netlet.marketplace 2>/dev/null || true
            args=(-NetLetDemo YES -netlet.language "$2" -NetLetOpen "$3")
            [ -n "$4" ] && args+=(-NetLetDemoAs "$4")
            xcrun simctl launch "$SIM" com.netlet.marketplace "${args[@]}" >/dev/null
            sleep 9
            xcrun simctl io "$SIM" screenshot --type=png "build/previews/$2-$1.png" >/dev/null 2>&1
          }
          for lang in en ar; do
            shot 01-home "$lang" home ""
            shot 02-department "$lang" department:grocery ""
            shot 03-product "$lang" product:basmati-rice-5kg ""
            shot 04-search "$lang" search:rice ""
            shot 05-sign-in "$lang" account ""
            shot 06-cart "$lang" cart shopper
            shot 07-checkout "$lang" checkout shopper
            shot 08-orders "$lang" orders shopper
            shot 09-account "$lang" account shopper
            shot 10-selling "$lang" sell shopper
            shot 11-new-listing "$lang" newListing shopper
            shot 12-categories "$lang" categories ""
            shot 13-search-sheet "$lang" searchOpen ""
            shot 14-addresses "$lang" section:addresses shopper
            shot 15-preferences "$lang" section:preferences shopper
            shot 16-notifications "$lang" section:notifications shopper
            shot 17-wishlist "$lang" wishlist:24 shopper
            shot 18-messages "$lang" sellerThread:1 shopper
            shot 19-help "$lang" supportThread:1 shopper
            shot 20-rewards "$lang" section:rewards shopper
            shot 21-affiliate "$lang" section:affiliate shopper
            shot 22-help "$lang" page:help ""
            shot 23-terms "$lang" page:terms ""
            shot 24-guide "$lang" page:guides/how-to-return-an-item ""
            shot 25-gift-list "$lang" page:gifts/3Uw_z-D7MEV5zRx9dULTA3MyjvZLZnm9 ""
            shot 26-sell "$lang" page:sell shopper
            shot 27-order "$lang" order:NL-20261001-J7MWY shopper
            shot 28-invoice "$lang" page:invoices/INV-2026-000002 shopper
            shot 29-assistant "$lang" chat ""
            shot 30-portal-products "$lang" portal:/admin/products shopper
            shot 31-portal-orders "$lang" portal:/admin/orders shopper
            shot 32-portal-payouts "$lang" portal:/admin/payouts shopper
          done
          ls -1 build/previews

      # Run by hand with `share`, small copies are posted as neutral check runs
      # on the commit, two to a run (a check run's summary and text hold 64 KB
      # each), where the checks API returns them whole — for a reader who can
      # use the API but cannot download an artifact. Never on an ordinary push,
      # which would hang eleven extra checks on every commit.
      - name: Share previews as check runs
        if: steps.previews.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.share
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for f in build/previews/*.png; do
            name=$(basename "$f" .png)
            for quality in 55 45 35 25; do
              sips -s format jpeg -s formatOptions "$quality" --resampleWidth 390 "$f" --out "build/small/$name.jpg" >/dev/null
              [ "$(base64 -i "build/small/$name.jpg" | wc -c)" -lt 60000 ] && break
            done
          done
          python3 - <<'PY'
          import base64, glob, json, os, subprocess
          files = sorted(glob.glob("build/small/*.jpg"))
          pairs = [files[i:i + 2] for i in range(0, len(files), 2)]
          for number, pair in enumerate(pairs, 1):
              fields = []
              for path in pair:
                  name = os.path.basename(path)[:-4]
                  fields.append(name + "\n" + base64.b64encode(open(path, "rb").read()).decode())
              body = {
                  "name": f"iOS preview {number} of {len(pairs)}",
                  "head_sha": os.environ["SHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {
                      "title": " and ".join(os.path.basename(p)[:-4] for p in pair),
                      "summary": fields[0],
                      **({"text": fields[1]} if len(fields) > 1 else {}),
                  },
              }
              subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/check-runs", "--input", "-"],
                             input=json.dumps(body).encode(), check=True, stdout=subprocess.DEVNULL)
          print(f"posted {len(pairs)} preview check runs")
          PY

      - name: Keep the previews
        if: steps.previews.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-previews
          path: Frontend/iOS/build/previews
          retention-days: 14

      - name: Keep the log and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            Frontend/iOS/build/xcodebuild.log
            Frontend/iOS/build/NetLet.xcresult
          retention-days: 7
