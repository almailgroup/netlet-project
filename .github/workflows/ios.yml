name: iOS

# Builds the SwiftUI app and runs its unit tests on a simulator. It runs when
# the app or this file changes; a change to `Shared/` that the app copies is
# caught on Linux by `Frontend/iOS/scripts/exportShared.test.ts`, which fails
# until `pnpm ios:resources` has been run and its output committed here.
on:
  push:
    paths:
      - "Frontend/iOS/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Frontend/iOS/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      share:
        description: Also post small copies of the previews as check runs on the commit
        type: boolean
        default: false

# A newer push cancels an older one's run, since the newer commit is the one
# TestFlight should get. A run started by hand never cancels anything — it
# waits — because cancelling a push's run would also lose that push's upload.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    # The previews are most of the run — about half a minute a screen, in two
    # languages — and grow with every screen added; the push of the address
    # screens finished 0s inside the old 40 minutes, and a run that times out
    # uploads nothing to TestFlight.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Frontend/iOS
    steps:
      - uses: actions/checkout@v4

      # The Xcode the app ships with (testflight.yml uses the same), so the
      # tests and the previews see the SDK a phone will run it under.
      - name: Xcode
        run: bash scripts/select-xcode.sh 26

      # The newest iPhone simulator the runner's Xcode has, chosen by id so the
      # job does not break when the image's list of devices changes.
      - name: Pick a simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)
          for key in sorted(runtimes, key=version, reverse=True):
              phones = [d for d in runtimes[key] if d.get("isAvailable") and d["name"].startswith("iPhone")]
              if version(key) >= (17, 0) and phones:
                  print(phones[0]["udid"])
                  break
          ')
          test -n "$id" || { echo "No iOS 17+ iPhone simulator available"; xcrun simctl list devices available; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        # The whole log is kept; what is printed is the errors, the app's own
        # warnings, each test's verdict and anything a test says on purpose
        # (a line carrying TEST-NOTE). The step fails with xcodebuild.
        run: |
          set +e
          mkdir -p build
          xcodebuild test \
            -project NetLet.xcodeproj \
            -scheme NetLet \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath build/NetLet.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log \
            | grep --line-buffered -E "error:|warning: .*/NetLet(Tests|UITests)?/|Test Case .* (passed|failed|skipped)|Test skipped|TEST-NOTE|Executed|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          exit "$status"

      # What the tests said on purpose (their TEST-NOTE lines), posted as one
      # neutral check run the moment the tests end. The job's log can be read
      # only once the whole job is over, and the previews after this are forty
      # minutes of it; the checks API answers at once. Nothing is posted when
      # no test noted anything, so an ordinary push hangs no extra check.
      - name: Post what the tests noted
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          try:
              lines = open("build/xcodebuild.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          notes = []
          for line in lines:
              at = line.find("TEST-NOTE")
              if at >= 0 and line[at:].strip() not in notes:
                  notes.append(line[at:].strip())
          if not notes:
              print("no test notes")
              raise SystemExit(0)
          body = {
              "name": "iOS test notes",
              "head_sha": os.environ["SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": f"{len(notes)} note(s) from the tests", "summary": "\n\n".join(notes)[:60000]},
          }
          subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/check-runs", "--input", "-"],
                         input=json.dumps(body).encode(), check=True, stdout=subprocess.DEVNULL)
          print(f"posted {len(notes)} test note(s)")
          PY

      # A preview for anybody without a Mac: the app built above, installed on
      # the same simulator and opened on each screen in both languages,
      # answering from the demo recordings (-NetLetDemo YES). Full-size
      # pictures go up as the ios-previews artifact.
      - name: Take previews
        id: previews
        # Pictures are a courtesy; the tests above are the verdict.
        continue-on-error: true
        env:
          SIM: ${{ steps.simulator.outputs.id }}
        run: |
          set -e
          app=build/DerivedData/Build/Products/Debug-iphonesimulator/NetLet.app
          test -d "$app"
          mkdir -p build/previews build/small
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b >/dev/null
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$SIM" "$app"
          # The map asks for the location as it opens for a new pin: answer
          # yes, from Salmiya, so the picture is the map where the shopper is
          # rather than the system's question over it.
          xcrun simctl privacy "$SIM" grant location com.netlet.marketplace || true
          xcrun simctl location "$SIM" set 29.3376,48.0757 || true
          # The keyboard's first-use lesson ("Speed up your typing by sliding
          # your finger…") covered the search sheet's foot in every picture.
          xcrun simctl spawn "$SIM" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$SIM" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true || true
          shot() {  # name, language, screen, as
            xcrun simctl terminate "$SIM" com.netlet.marketplace 2>/dev/null || true
            args=(-NetLetDemo YES -netlet.language "$2" -NetLetOpen "$3")
            [ -n "$4" ] && args+=(-NetLetDemoAs "$4")
            xcrun simctl launch "$SIM" com.netlet.marketplace "${args[@]}" >/dev/null
            sleep 9
            xcrun simctl io "$SIM" screenshot --type=png "build/previews/$2-$1.png" >/dev/null 2>&1
          }
          for lang in en ar; do
            shot 01-home "$lang" home ""
            shot 02-department "$lang" department:grocery ""
            shot 03-product "$lang" product:basmati-rice-5kg ""
            shot 04-search "$lang" search:rice ""
            shot 05-sign-in "$lang" account ""
            shot 05b-sign-up "$lang" signup ""
            # Continue with phone number: the number, the texted code, and the optional email.
            shot 05c-phone "$lang" phone ""
            shot 05d-phone-code "$lang" phone:code ""
            shot 05e-phone-email "$lang" phone:email ""
            # Signing in with a one-time code: the choice, then the emailed code.
            shot 05f-code-choice "$lang" codeSignIn ""
            shot 05g-code-step "$lang" codeSignIn:step ""
            # Face ID, the third way in, for an address this phone has a key for.
            shot 05h-face-id "$lang" faceId ""
            shot 06-cart "$lang" cart shopper
            shot 07-checkout "$lang" checkout shopper
            shot 08-orders "$lang" orders shopper
            shot 09-account "$lang" account shopper
            shot 10-selling "$lang" sell shopper
            shot 11-new-listing "$lang" newListing shopper
            shot 12-categories "$lang" categories ""
            shot 13-search-sheet "$lang" searchOpen ""
            shot 14-addresses "$lang" section:addresses shopper
            shot 15-preferences "$lang" section:preferences shopper
            shot 16-notifications "$lang" section:notifications shopper
            shot 17-wishlist "$lang" wishlist:24 shopper
            shot 19-help "$lang" supportThread:1 shopper
            shot 20-rewards "$lang" section:rewards shopper
            shot 21-affiliate "$lang" section:affiliate shopper
            shot 22-help "$lang" page:help ""
            shot 23-terms "$lang" page:terms ""
            shot 24-guide "$lang" page:guides/how-to-return-an-item ""
            shot 25-gift-list "$lang" page:gifts/3Uw_z-D7MEV5zRx9dULTA3MyjvZLZnm9 ""
            shot 26-sell "$lang" page:sell shopper
            shot 27-order "$lang" order:NL-20261001-J7MWY shopper
            shot 61-order-track "$lang" track:NL-20261001-J7MWY shopper
            shot 62-order-refund "$lang" refund:NL-20261001-J7MWY shopper
            shot 63-returns "$lang" section:returns shopper
            shot 64-payments "$lang" section:payments shopper
            shot 28-invoice "$lang" page:invoices/INV-2026-000002 shopper
            shot 29-assistant "$lang" chat ""
            shot 30-portal-products "$lang" portal:/admin/products shopper
            shot 31-portal-orders "$lang" portal:/admin/orders shopper
            shot 32-portal-payouts "$lang" portal:/admin/payouts shopper
            shot 33-portal-editor "$lang" portal:/admin/products/10 shopper
            shot 34-portal-fulfilment "$lang" portal:/admin/fulfilment shopper
            shot 35-portal-ads "$lang" portal:/admin/ads shopper
            shot 36-admin-applications "$lang" portal:/admin/applications admin
            shot 37-admin-people "$lang" portal:/admin/people admin
            shot 38-admin-features "$lang" portal:/admin/features admin
            shot 39-admin-audit "$lang" portal:/admin/audit admin
            shot 40-admin-stores "$lang" portal:/admin/vendors admin
            shot 41-admin-store "$lang" portal:/admin/vendors/2 admin
            shot 42-admin-finance "$lang" portal:/admin/finance admin
            shot 43-admin-promotions "$lang" portal:/admin/promotions admin
            shot 44-admin-support "$lang" portal:/admin/support/5 admin
            shot 45-admin-guide "$lang" portal:/admin/guides/1 admin
            shot 46-admin-couriers "$lang" portal:/admin/couriers admin
            shot 47-admin-new-product "$lang" portal:/admin/products/new admin
            shot 48-product-photos "$lang" photos:wireless-earbuds ""
            shot 49-product-zoom "$lang" zoom:wireless-earbuds ""
            shot 50-search-typing "$lang" searchOpen:rice ""
            shot 51-admin-fraud "$lang" portal:/admin/fraud admin
            shot 52-admin-commission "$lang" portal:/admin/commission admin
            shot 53-product-preview "$lang" preview:wireless-earbuds ""
            shot 54-tab-bar-away "$lang" tabBarAway ""
            shot 55-address-pin "$lang" address:pin shopper
            shot 56-address-confirm "$lang" address:confirm shopper
            shot 57-address-edit "$lang" address:edit shopper
            shot 59-categories-open "$lang" categories:grocery ""
            shot 60-subcategory "$lang" subcategory:grocery/pantry ""
            shot 65-tutorial "$lang" tutorial ""
            shot 66-tutorial-account "$lang" tutorial:1 ""
            shot 67-tutorial-last "$lang" tutorial:4 ""
            shot 68-browse-sort "$lang" browseSheet:all/sort ""
            shot 69-browse-price "$lang" browseSheet:all/price ""
            shot 70-deals "$lang" deals ""
            shot 71-order-rate "$lang" rate:NL-20261001-J7MWY shopper
            # The after-sales centre: a claim on what arrived, help with the
            # order, and — on the recorded pending order — modifying it and
            # sending it elsewhere; then the store's warranty desk.
            shot 72-order-warranty "$lang" warranty:NL-20261001-J7MWY shopper
            shot 73-order-help "$lang" help:NL-20261001-J7MWY shopper
            shot 74-order-modify "$lang" modify:NL-AS-PENDING pending
            shot 75-order-address "$lang" orderAddress:NL-AS-PENDING pending
            shot 76-portal-warranty "$lang" portal:/admin/warranty shopper
            # Frequently bought: the list with its usual amounts and what was bought before.
            shot 77-frequent "$lang" frequent shopper
            # Place order asks first, and the order placed is said over checkout.
            shot 78-checkout-confirm "$lang" confirmOrder shopper
            shot 79-order-placed "$lang" orderPlaced:NL-20261001-J7MWY shopper
            # The help centre: an issue answered from the order with its act, the
            # help page's issues, the notification groups and the browsing history.
            shot 80-order-help-issue "$lang" helpIssue:NL-20261001-J7MWY shopper
            shot 81-help-centre "$lang" page:help shopper
            shot 82-history "$lang" section:history shopper
            # Your profile, with its photo card first (the shop keeps photos in the recording).
            shot 83-your-profile "$lang" profile shopper
            # An account made with a phone: the Email card where the password was.
            shot 83b-your-profile-phone "$lang" profile phone
            # Face ID: the offer after signing in, and its card on Your profile.
            shot 84-face-id-offer "$lang" faceIdOffer shopper
            shot 85-face-id-card "$lang" faceIdCard shopper
            # My orders' Reviews tab (Returns is 63), which moved from the Profile tab.
            shot 86-orders-reviews "$lang" section:reviews shopper
            # Saved items and wishlists in one page, opened on its Wishlists tab.
            shot 87-saved-wishlists "$lang" section:wishlists shopper
            # Authorised devices: the owner's desk, and an install still waiting.
            shot 88-admin-devices "$lang" portal:/admin/devices admin
            shot 89-device-waiting "$lang" portal:/admin newdevice
            # The portal's dashboard for a store and for NetLet, the live stock
            # page, and the co-pilot's brief.
            shot 90-portal-dashboard "$lang" portal:/admin shopper
            shot 91-admin-dashboard "$lang" portal:/admin admin
            shot 92-portal-stock "$lang" portal:/admin/stock shopper
            shot 93-portal-copilot "$lang" copilot shopper
            # The Deals tab's burst, held mid-flight: the bag landed, the pieces out.
            shot 94-deals-burst "$lang" dealsBurst ""
          done
          # The live shop, not the recordings: its sellers' own photo servers
          # are what a recording cannot show — slow, large, uncached, which is
          # what left every photo but one empty under AsyncImage.
          live() {  # name, screen
            xcrun simctl terminate "$SIM" com.netlet.marketplace 2>/dev/null || true
            xcrun simctl launch "$SIM" com.netlet.marketplace -netlet.language en -NetLetOpen "$2" >/dev/null
            sleep 20
            xcrun simctl io "$SIM" screenshot --type=png "build/previews/en-$1.png" >/dev/null 2>&1
          }
          live 60-live-home home
          live 61-live-department department:beauty
          live 62-live-search search:cream
          ls -1 build/previews

      # Run by hand with `share`, small copies are posted as neutral check runs
      # on the commit, two to a run (a check run's summary and text hold 64 KB
      # each), where the checks API returns them whole — for a reader who can
      # use the API but cannot download an artifact. Never on an ordinary push,
      # which would hang eleven extra checks on every commit.
      - name: Share previews as check runs
        if: steps.previews.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.share
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for f in build/previews/*.png; do
            name=$(basename "$f" .png)
            for quality in 55 45 35 25; do
              sips -s format jpeg -s formatOptions "$quality" --resampleWidth 390 "$f" --out "build/small/$name.jpg" >/dev/null
              [ "$(base64 -i "build/small/$name.jpg" | wc -c)" -lt 60000 ] && break
            done
          done
          python3 - <<'PY'
          import base64, glob, json, os, subprocess
          files = sorted(glob.glob("build/small/*.jpg"))
          pairs = [files[i:i + 2] for i in range(0, len(files), 2)]
          for number, pair in enumerate(pairs, 1):
              fields = []
              for path in pair:
                  name = os.path.basename(path)[:-4]
                  fields.append(name + "\n" + base64.b64encode(open(path, "rb").read()).decode())
              body = {
                  "name": f"iOS preview {number} of {len(pairs)}",
                  "head_sha": os.environ["SHA"],
                  "status": "completed",
                  "conclusion": "neutral",
                  "output": {
                      "title": " and ".join(os.path.basename(p)[:-4] for p in pair),
                      "summary": fields[0],
                      **({"text": fields[1]} if len(fields) > 1 else {}),
                  },
              }
              subprocess.run(["gh", "api", f"repos/{os.environ['REPO']}/check-runs", "--input", "-"],
                             input=json.dumps(body).encode(), check=True, stdout=subprocess.DEVNULL)
          print(f"posted {len(pairs)} preview check runs")
          PY

      - name: Keep the previews
        if: steps.previews.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-previews
          path: Frontend/iOS/build/previews
          retention-days: 14

      # A crash leaves its report on the Mac, not in the test log or a
      # picture: the portal's dashboard was a home-screen picture for a
      # whole run before anybody knew why. Print NetLet's reports, the
      # reason and the faulting thread, so a run names the line that
      # stopped the app.
      - name: Print the app's crash reports
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, json, os
          folder = os.path.expanduser("~/Library/Logs/DiagnosticReports")
          paths = sorted(glob.glob(os.path.join(folder, "NetLet*.ips")), key=os.path.getmtime)
          print(f"{len(paths)} NetLet crash report(s)")
          for path in paths[-4:]:
              text = open(path, encoding="utf-8", errors="replace").read()
              _, _, body = text.partition("\n")
              print("====", os.path.basename(path))
              try:
                  report = json.loads(body)
              except ValueError:
                  print(text[:6000])
                  continue
              print("exception:", json.dumps(report.get("exception")))
              print("termination:", json.dumps(report.get("termination"))[:800])
              if report.get("asi"):
                  print("asi:", json.dumps(report["asi"])[:2000])
              images = report.get("usedImages", [])
              threads = report.get("threads", [])
              faulting = report.get("faultingThread", 0)
              if faulting < len(threads):
                  for frame in threads[faulting].get("frames", [])[:45]:
                      index = frame.get("imageIndex", -1)
                      image = images[index].get("name", "?") if 0 <= index < len(images) else "?"
                      symbol = frame.get("symbol", hex(frame.get("imageOffset", 0)))
                      where = f"  {frame['sourceFile']}:{frame.get('sourceLine')}" if frame.get("sourceFile") else ""
                      print(f"  {image}  {symbol}{where}")
          PY

      - name: Keep the log and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            Frontend/iOS/build/xcodebuild.log
            Frontend/iOS/build/NetLet.xcresult
          retention-days: 7
