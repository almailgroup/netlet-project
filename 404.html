    <!-- No maximum-scale: capping it blocks pinch-zoom, which WCAG 1.4.4 treats
         as a failure and which anyone reading small print on a phone needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    />

    <!-- Defaults for the first paint and for any crawler that does not run
         JavaScript. Each route overwrites these through usePageMeta. -->
    <meta property="og:site_name" content="NetLet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NetLet — a Kuwait marketplace for the everyday" />

    <link rel="manifest" href="/netlet-project/site.webmanifest" />

    <!-- The stylesheet is fetched without blocking rendering, then promoted to
         `all` once it arrives. A <link rel=stylesheet> in <head> blocks script
         execution until it resolves, so an unreachable or slow
         fonts.googleapis.com left the page blank rather than merely unstyled —
         measured: readyState stuck at "interactive" with an empty #root and no
         error anywhere. The <noscript> keeps the webfont for the rare visitor
         with JavaScript off, where nothing is blocked anyway. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      />
