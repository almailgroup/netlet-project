<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: capping it blocks pinch-zoom, which WCAG 1.4.4 treats
         as a failure and which anyone reading small print on a phone needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a285a" />

    <title>NetLet — a Kuwait marketplace for the everyday</title>
    <meta
      name="description"
      content="NetLet is a Kuwait marketplace for home, technology and everyday things — with delivery across all six governorates."
    />

    <!-- Defaults for the first paint and for any crawler that does not run
         JavaScript. Each route overwrites these through usePageMeta. -->
    <meta property="og:site_name" content="NetLet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NetLet — a Kuwait marketplace for the everyday" />
    <meta
      property="og:description"
      content="Home, technology and everyday things, delivered across Kuwait."
    />
    <meta property="og:image" content="/brand/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Recovers a visitor whose cache holds something other than a built
         file under that file's name. public/asset-recovery.js says why. -->
    <script src="/asset-recovery.js" defer></script>

    <!-- The stylesheet is fetched without blocking rendering, then promoted to
         `all` once it arrives. A <link rel=stylesheet> in <head> blocks script
         execution until it resolves, so an unreachable or slow
         fonts.googleapis.com left the page blank rather than merely unstyled —
         measured: readyState stuck at "interactive" with an empty #root and no
         error anywhere. The <noscript> keeps the webfont for the rare visitor
         with JavaScript off, where nothing is blocked anyway.

         One variable file for weights 400 to 700, rather than eight static
         styles. Nothing on the site is italic, and 700 is the heaviest weight
         that has ever been drawn: 800 was never requested, so `font-extrabold`
         has always rendered at 700 and still does. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
